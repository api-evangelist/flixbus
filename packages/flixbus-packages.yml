summary:
  official_packages: 0
  community_packages: 5
  note: >-
    Flix publishes NO first-party client library on any public registry. The flix-tech
    GitHub organization (156 public repos) is infrastructure and forks — Kafka, Avro,
    Kubernetes, Terraform, iOS tooling — with no Flix API SDK. The former
    flix-tech/public-api-java-examples repository, which carried FlixMobility's Java
    example code for the Public API, now returns 404. Partner SDK material, if any, is
    behind the Entra ID login on developer.api.flixbus.com; the portal is documented as
    distributing example Postman collections rather than packaged SDKs.
