apis:
- name: Flix API
  description: 'The partner-facing Flix API, published through the Flix Developer Portal.
    Documentation covers API references, getting-started guides, changelogs and example
    Postman collections for Flix distribution and affiliate partners (search, availability,
    booking and ticketing over JSON/REST). Access is gated: the developer portal requires
    a Microsoft Entra ID sign-in and the API gateway at global.api.flixbus.com returns
    403/401 to anonymous callers, so credentials are issued only under a distribution-partner
    agreement.'
  humanURL: https://developer.api.flixbus.com/
  baseURL: https://global.api.flixbus.com
