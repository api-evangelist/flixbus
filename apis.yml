- name: Flix GTFS Schedule Feeds
  description: 'First-party GTFS Schedule feeds published by FlixMobility Tech GmbH covering
    the FlixBus and FlixTrain networks. Three anonymous, unauthenticated regional archives
    are served from gtfs.gis.flix.tech — Europe (gtfs_generic_eu.zip), the United States
    (gtfs_generic_us.zip) and Great Britain (gtfs_generic_gb.zip) — each a standard GTFS
    bundle with agency, routes, trips, stops, stop_times, calendar, transfers and shapes.
    The feeds are aggregated by Transitland, the Mobility Database and transport.data.gouv.fr
    under an ODbL-1.0 license.'
  humanURL: https://www.transit.land/feeds/f-u-flixbus
  baseURL: https://gtfs.gis.flix.tech
