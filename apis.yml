aid: flixbus
name: FlixBus
description: 'FlixBus is the long-distance coach brand of Flix SE (formerly FlixMobility),
  a Munich-headquartered mobility provider that also operates FlixTrain in Europe and
  Greyhound in North America. Flix runs an asset-light model: it owns the brand, network
  planning, pricing, distribution and technology while regional bus partners operate
  the vehicles. Its technology surface is split in two. A partner-facing Flix API is
  published through the Flix Developer Portal at developer.api.flixbus.com — a Redocly-based
  catalogue of API references, getting-started guides, changelogs and downloadable Postman
  collections — but the portal is gated behind Microsoft Entra ID (Azure AD) sign-in and
  the underlying gateway at global.api.flixbus.com rejects anonymous requests, so no
  machine-readable OpenAPI is reachable without a distribution-partner agreement (requested
  via online-distribution@flixbus.com). Publicly and anonymously, Flix does publish schedule
  data as first-party GTFS Schedule feeds for Europe, the United States and Great Britain
  from gtfs.gis.flix.tech, refreshed regularly and licensed ODbL-1.0 through national
  open-data portals.'
